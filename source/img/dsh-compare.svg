    <text x="330" y="362" text-anchor="middle" font-size="11.5" fill="#475569">8.4 万星 · MIT · 多 Agent 研究向</text>
  </g>
  <g>
    <circle cx="700" cy="600" r="14" fill="#4285F4" stroke="#fff" stroke-width="3"/>
    <text x="700" y="576" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">Gemini CLI</text>
    <text x="700" y="628" text-anchor="middle" font-size="11.5" fill="#475569">10.7 万星 · Apache-2.0 · Google 生态</text>
  </g>
  <g>
