<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="860" height="470" fill="#f7f9fb"/>
  <text x="40" y="34" font-size="17" font-weight="bold" fill="#1f2b36">DXF 叠卫星影像：投影带定错，图能开、位置全飘</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a5a68"/>
    </marker>
  </defs>

  <!-- 左：带号判断 -->
  <rect x="40" y="54" width="380" height="118" rx="8" fill="#ffffff" stroke="#8fa3b2" stroke-width="1.6"/>
  <text x="58" y="78" font-size="14.5" font-weight="bold" fill="#1f2b36">先看东坐标有几位（阳春约 111.8°E）</text>
  <text x="58" y="102" font-size="12.5" fill="#2f6f8f">6 位 如 456789 / 512345 → 不带带号</text>
  <text x="58" y="120" font-size="12.5" fill="#5c6b78">　中央子午线 111°E，EPSG:4546</text>
  <text x="58" y="142" font-size="12.5" fill="#8a3222">8 位 如 37512345 → 带带号（37 = 第 37 带）</text>
  <text x="58" y="160" font-size="12.5" fill="#5c6b78">　坐标系列表里选带 zone 的那一版</text>

  <rect x="40" y="184" width="380" height="52" rx="8" fill="#fdf3f3" stroke="#c0705f" stroke-width="1.6"/>
  <text x="58" y="207" font-size="13.5" fill="#8a3222">3 度带 37 带 ＝ CM 111°E；6 度带 19 带也是 111°E</text>
  <text x="58" y="226" font-size="12.5" fill="#8a5548">两者数值不是一回事，别按经验硬填</text>

  <!-- 右：图层顺序 -->
  <rect x="452" y="54" width="368" height="182" rx="8" fill="#ffffff" stroke="#8fa3b2" stroke-width="1.6"/>
  <text x="470" y="78" font-size="14.5" font-weight="bold" fill="#1f2b36">画布上的图层顺序</text>
  <rect x="470" y="90" width="332" height="34" rx="5" fill="#eef4f8" stroke="#2f6f8f" stroke-width="1.4"/>
  <text x="484" y="112" font-size="13" fill="#1f2b36">渠道线 DXF（导进来就标 EPSG:4546）</text>
  <rect x="470" y="130" width="332" height="34" rx="5" fill="#eef4f8" stroke="#2f6f8f" stroke-width="1.4"/>
  <text x="484" y="152" font-size="13" fill="#1f2b36">Esri 影像 XYZ 瓦片（{z}/{y}/{x}，17~19 级）</text>
  <rect x="470" y="170" width="332" height="34" rx="5" fill="#eef4f8" stroke="#2f6f8f" stroke-width="1.4"/>
  <text x="484" y="192" font-size="13" fill="#1f2b36">桥 / 涵洞 / 老路（对位用的锚点）</text>
  <text x="470" y="224" font-size="12.5" fill="#5c6b78">线压着影像上的渠走，说明带号选对了</text>

  <!-- 中：修正 -->
  <line x1="230" y1="238" x2="230" y2="262" stroke="#4a5a68" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="40" y="266" width="240" height="80" rx="8" fill="#ffffff" stroke="#2f6f8f" stroke-width="1.8"/>
  <text x="58" y="290" font-size="14" fill="#1f2b36">① 整体错一个固定量</text>
  <text x="58" y="311" font-size="12.5" fill="#5c6b78">工具箱搜 translate</text>
  <text x="58" y="330" font-size="12.5" fill="#5c6b78">填 X/Y 偏移（实测 − 图上）</text>

  <rect x="310" y="266" width="240" height="80" rx="8" fill="#ffffff" stroke="#2f6f8f" stroke-width="1.8"/>
  <text x="328" y="290" font-size="14" fill="#1f2b36">② 又偏又转（独立坐标）</text>
  <text x="328" y="311" font-size="12.5" fill="#5c6b78">两个已知点算平移 + 旋转角</text>
  <text x="328" y="330" font-size="12.5" fill="#5c6b78">工具箱搜 rotate / affine</text>

  <rect x="580" y="266" width="240" height="80" rx="8" fill="#ffffff" stroke="#8fa3b2" stroke-width="1.6"/>
  <text x="598" y="290" font-size="14" fill="#1f2b36">③ 量算与交底出图</text>
  <text x="598" y="311" font-size="12.5" fill="#5c6b78">字段计算器 $length 对桩号</text>
  <text x="598" y="330" font-size="12.5" fill="#5c6b78">导出地图为图像（PNG）</text>

  <!-- 底部命令 -->
  <rect x="40" y="366" width="780" height="72" rx="8" fill="#1f2b36"/>
  <text x="60" y="392" font-size="13" fill="#eaf1f6">brew install --cask qgis@ltr　　# 3.44.14 LTR（长期版，菜单不会老挪）</text>
  <text x="60" y="420" font-size="13" fill="#eaf1f6">ogr2ogr -f GPKG -a_srs EPSG:4546 渠道.gpkg 渠道.dxf　# 命令行批量转</text>
</svg>
