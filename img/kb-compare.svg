  <!-- conclusion -->
  <rect x="40" y="578" width="1120" height="104" rx="12" fill="url(#c1)"/>
  <text x="600" y="612" text-anchor="middle" font-size="18" font-weight="700" fill="#EFE6DA">Obsidian 的独特位置：全维度「本地可控」</text>
  <text x="600" y="642" text-anchor="middle" font-size="14" fill="rgba(98,118,218,0.20)">数据是你的纯文本文件 → 永远不会被关停/改版绑架；双链图谱 + 插件生态 = 一个能长成系统的工具；</text>
  <text x="600" y="666" text-anchor="middle" font-size="14" fill="rgba(98,118,218,0.20)">最关键：AI 时代它是少数几个能让智能体直接读写同一份知识库的主流工具（本地 Markdown 即接口）。</text>

  <rect x="40" y="694" width="1120" height="128" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="600" y="726" text-anchor="middle" font-size="15" font-weight="700" fill="#C2CFE0">客观说缺点（不吹）</text>
  <text x="600" y="754" text-anchor="middle" font-size="13.5" fill="#E1D3C1">· 官方云同步（Sync）收费，免费方案要自己搭 iCloud / Git / 坚果云 · 多人实时协作弱于 Notion/语雀</text>
  <text x="600" y="778" text-anchor="middle" font-size="13.5" fill="#E1D3C1">· 移动端 App 体验不如印象笔记顺滑 · 插件功能强但需要折腾 · 大纲/数据库类需求不如 Logseq/Notion 原生</text>
  <text x="600" y="802" text-anchor="middle" font-size="13.5" fill="#E1D3C1">→ 适合：个人知识库、长期积累型笔记、双链思考、开发者/AI 用户、内容创作</text>
</svg>
