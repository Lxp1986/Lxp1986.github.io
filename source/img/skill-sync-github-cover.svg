<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="sg-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
  </defs>

  <!-- 无全幅底色：外层透明 -->
  <text x="600" y="72" text-anchor="middle" font-size="44" font-weight="700" fill="#EFE6DA">Skill 是资产：本地 → GitHub 公共仓库</text>
  <text x="600" y="112" text-anchor="middle" font-size="17" fill="#A7B9D2">自建 skill 同步五步法 · 核对到 2026-10-03</text>

  <!-- 步骤卡片 -->
  <rect x="40" y="160" width="200" height="240" rx="14" fill="rgba(98,126,218,0.16)" stroke="#A6C0F2" stroke-width="1.5"/>
  <circle cx="80" cy="200" r="18" fill="url(#sg-g)"/>
  <text x="80" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">1</text>
  <text x="112" y="207" font-size="20" font-weight="700" fill="#B7C3EB">命名</text>
  <text x="66" y="248" font-size="14" fill="#E1D3C1">英文短横线</text>
  <text x="66" y="274" font-size="14" fill="#A7B9D2">一眼看懂用途</text>
  <text x="66" y="300" font-size="14" fill="#A7B9D2">如 nvzhuang-video</text>
  <text x="66" y="352" font-size="13" fill="#9EF1BD">~/workspace/skills/</text>
  <text x="66" y="374" font-size="13" fill="#9EF1BD">&lt;name&gt;/ 落盘</text>

  <rect x="264" y="160" width="200" height="240" rx="14" fill="rgba(158,241,189,0.10)" stroke="#9EF1BD" stroke-width="1.5"/>
  <circle cx="304" cy="200" r="18" fill="url(#sg-g)"/>
  <text x="304" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">2</text>
  <text x="336" y="207" font-size="20" font-weight="700" fill="#9EF1BD">整理目录</text>
  <text x="290" y="248" font-size="14" fill="#E1D3C1">SKILL.md 定稿</text>
  <text x="290" y="274" font-size="14" fill="#A7B9D2">配套文件齐全</text>
  <text x="290" y="300" font-size="14" fill="#A7B9D2">文件名全小写</text>
  <text x="290" y="352" font-size="13" fill="#F2B0B0">大小写坑：远端敏感</text>
  <text x="290" y="374" font-size="13" fill="#F2B0B0">本地 macOS 不敏感</text>

  <rect x="488" y="160" width="200" height="240" rx="14" fill="rgba(98,126,218,0.16)" stroke="#A6C0F2" stroke-width="1.5"/>
  <circle cx="528" cy="200" r="18" fill="url(#sg-g)"/>
  <text x="528" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">3</text>
  <text x="560" y="207" font-size="20" font-weight="700" fill="#B7C3EB">更新索引</text>
  <text x="514" y="248" font-size="14" fill="#E1D3C1">skills.json 登记</text>
  <text x="514" y="274" font-size="14" fill="#A7B9D2">名称 / 路径 / 文件列表</text>
  <text x="514" y="300" font-size="14" fill="#A7B9D2">机器可读，给 agent 用</text>
  <text x="514" y="352" font-size="13" fill="#F2B0B0">漏登记 = 没入库</text>

  <rect x="712" y="160" width="200" height="240" rx="14" fill="rgba(158,241,189,0.10)" stroke="#9EF1BD" stroke-width="1.5"/>
  <circle cx="752" cy="200" r="18" fill="url(#sg-g)"/>
  <text x="752" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">4</text>
  <text x="784" y="207" font-size="20" font-weight="700" fill="#9EF1BD">API 推送</text>
  <text x="738" y="248" font-size="14" fill="#E1D3C1">Contents API 逐文件 PUT</text>
  <text x="738" y="274" font-size="14" fill="#A7B9D2">git CLI push 走不通</text>
  <text x="738" y="300" font-size="14" fill="#A7B9D2">Token 仅开 Contents 读写</text>
  <text x="738" y="352" font-size="13" fill="#A7B9D2">message 带 skill 名</text>

  <rect x="936" y="160" width="200" height="240" rx="14" fill="rgba(98,126,218,0.16)" stroke="#A6C0F2" stroke-width="1.5"/>
  <circle cx="976" cy="200" r="18" fill="url(#sg-g)"/>
  <text x="976" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">5</text>
  <text x="1008" y="207" font-size="20" font-weight="700" fill="#B7C3EB">回验</text>
  <text x="962" y="248" font-size="14" fill="#E1D3C1">远端拉回算 SHA-256</text>
  <text x="962" y="274" font-size="14" fill="#A7B9D2">逐文件比对本地</text>
  <text x="962" y="300" font-size="14" fill="#A7B9D2">全 MATCH 才算完</text>
  <text x="962" y="352" font-size="13" fill="#9EF1BD">nvzhuang-video：5/5 通过</text>

  <!-- 底部结论条 -->
  <rect x="40" y="440" width="1120" height="76" rx="12" fill="rgba(158,241,189,0.10)" stroke="#9EF1BD" stroke-width="1.5"/>
  <text x="600" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#EFE6DA">12 个 skill 已同步 · 本地与远端逐文件 SHA-256 一致</text>
  <text x="600" y="498" text-anchor="middle" font-size="14" fill="#A7B9D2">仓库 Lxp1986/skills · 分支保护 + secret scanning 已开</text>

  <text x="600" y="560" text-anchor="middle" font-size="14" fill="#DFD3C3">三色风 · 2026-10-03</text>
</svg>
