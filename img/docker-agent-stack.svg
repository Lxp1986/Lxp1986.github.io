<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6Z" fill="#79C8FF"/></marker></defs><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#E7DCCF">Agent 工作流：控制面与执行面</text><text x="600" y="115" text-anchor="middle" font-size="16" letter-spacing="3" fill="#B9A995">CONTROL PLANE</text><path d="M180 145H1020" stroke="#C9A7FF" stroke-width="3"/><text x="600" y="190" text-anchor="middle" font-size="28" fill="#D8B8FF">Paperclip</text><text x="600" y="222" text-anchor="middle" font-size="18" fill="#B9A995">目标 · 组织 · 任务 · 预算</text><path d="M600 240V290" stroke="#79C8FF" stroke-width="4" marker-end="url(#a)"/><text x="600" y="334" text-anchor="middle" font-size="16" letter-spacing="3" fill="#B9A995">EXECUTION PLANE</text><path d="M180 359H1020" stroke="#79C8FF" stroke-width="3"/><g text-anchor="middle"><text x="330" y="420" font-size="25" fill="#A9D9FF">Agent Runtime</text><text x="330" y="455" font-size="18" fill="#B9A995">Codex · Hermes · Claude Code</text><text x="870" y="420" font-size="25" fill="#79D7D1">Sandbox</text><text x="870" y="455" font-size="18" fill="#B9A995">文件 · 网络 · 凭证边界</text></g><path d="M520 430H670" stroke="#E4C57A" stroke-width="3" marker-end="url(#a)"/><path d="M180 493H1020" stroke="#536577" stroke-width="2"/><text x="600" y="548" text-anchor="middle" font-size="20" fill="#E7DCCF">谁决定任务 ≠ 谁执行任务 ≠ 任务在哪里运行</text><text x="600" y="598" text-anchor="middle" font-size="18" fill="#B9A995">拆开职责，才方便限制权限、核算成本和检查结果</text></g></svg>