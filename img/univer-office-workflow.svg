<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#E7DCCF">工程量表：先生成，再逐项验收</text><path d="M178 145V530" stroke="#536577" stroke-width="3"/><g><circle cx="178" cy="170" r="18" fill="#79C8FF"/><circle cx="178" cy="270" r="18" fill="#79D7D1"/><circle cx="178" cy="370" r="18" fill="#E4C57A"/><circle cx="178" cy="470" r="18" fill="#C9A7FF"/></g><g><text x="230" y="164" font-size="24" font-weight="700" fill="#A9D9FF">01 · 输入</text><text x="230" y="194" font-size="18" fill="#B9A995">CSV：断面、数量、单位和单价</text><text x="230" y="264" font-size="24" font-weight="700" fill="#79D7D1">02 · 整理</text><text x="230" y="294" font-size="18" fill="#B9A995">Agent 按分项生成表格与公式</text><text x="230" y="364" font-size="24" font-weight="700" fill="#E4C57A">03 · 核验</text><text x="230" y="394" font-size="18" fill="#B9A995">总量、引用、格式和异常逐项检查</text><text x="230" y="464" font-size="24" font-weight="700" fill="#D8B8FF">04 · 交付</text><text x="230" y="494" font-size="18" fill="#B9A995">人工复核、导出并保留可回退版本</text></g><path d="M690 168H1010M690 268H1010M690 368H1010M690 468H1010" stroke="#536577" stroke-width="2"/><g font-size="17" fill="#E7DCCF"><text x="710" y="155">输入值有来源</text><text x="710" y="255">公式可追溯</text><text x="710" y="355">异常能定位</text><text x="710" y="455">人可以继续编辑</text></g><text x="600" y="600" text-anchor="middle" font-size="20" fill="#E4C57A">文件生成只是中间步骤，能验收才算完成</text></g></svg>