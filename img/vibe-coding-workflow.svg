<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="vc-g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
    <marker id="vc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D6C7B2"/>
    </marker>
  </defs>

  
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#C2CFE0">Vibe Coding 工作流 · 一句话到能跑的代码</text>
  <text x="600" y="82" text-anchor="middle" font-size="15" fill="#DFD3C3">人只负责提需求和验收，写代码、改报错都交给 AI</text>

  <!-- 5 steps -->
  <rect x="60" y="150" width="196" height="90" rx="12" fill="url(#vc-g1)"/>
  <text x="158" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#EFE6DA">① 说清需求</text>
  <text x="158" y="214" text-anchor="middle" font-size="13" fill="rgba(98,149,218,0.20)">功能点列成清单</text>

  <rect x="296" y="150" width="196" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="#A6C0F2" stroke-width="1.5"/>
  <text x="394" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#B7C3EB">② 先给方案</text>
  <text x="394" y="214" text-anchor="middle" font-size="13" fill="#DFD3C3">确认方向再写码</text>

  <rect x="532" y="150" width="196" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="#A6C0F2" stroke-width="1.5"/>
  <text x="630" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#B7C3EB">③ 本地跑起来</text>
  <text x="630" y="214" text-anchor="middle" font-size="13" fill="#DFD3C3">报错原样贴给它</text>

  <rect x="768" y="150" width="196" height="90" rx="12" fill="rgba(255,255,255,0.07)" stroke="#A6C0F2" stroke-width="1.5"/>
  <text x="866" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#B7C3EB">④ 看 diff 验收</text>
  <text x="866" y="214" text-anchor="middle" font-size="13" fill="#DFD3C3">大改动先问为什么</text>

  <rect x="1004" y="150" width="136" height="90" rx="12" fill="#89F0E7"/>
  <text x="1072" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#EFE6DA">⑤ 提交</text>
  <text x="1072" y="214" text-anchor="middle" font-size="13" fill="rgba(98,218,203,0.20)">小步 commit</text>

  <!-- arrows -->
  <line x1="256" y1="195" x2="292" y2="195" stroke="#D6C7B2" stroke-width="2.5" marker-end="url(#vc-arrow)"/>
  <line x1="492" y1="195" x2="528" y2="195" stroke="#D6C7B2" stroke-width="2.5" marker-end="url(#vc-arrow)"/>
  <line x1="728" y1="195" x2="764" y2="195" stroke="#D6C7B2" stroke-width="2.5" marker-end="url(#vc-arrow)"/>
  <line x1="964" y1="195" x2="1000" y2="195" stroke="#D6C7B2" stroke-width="2.5" marker-end="url(#vc-arrow)"/>

  <!-- loop back -->
  <path d="M 866 240 L 866 310 Q 866 330 846 330 L 394 330 Q 374 330 374 310 L 374 244" fill="none" stroke="#F0A9A9" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#vc-arrow)"/>
  <rect x="540" y="308" width="240" height="36" rx="10" fill="rgba(218,98,98,0.20)"/>
  <text x="660" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#F3AFAF">没跑通？把报错喂回去，回到 ③</text>

  <!-- tips -->
  <rect x="60" y="390" width="1080" height="96" rx="12" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="90" y="424" font-size="15" font-weight="700" fill="#C2CFE0">三个提醒</text>
  <text x="90" y="452" font-size="14" fill="#E1D3C1">1. 动手前先 git commit 一次干净基线，改坏了随时回退；</text>
  <text x="90" y="476" font-size="14" fill="#E1D3C1">2. 聊久了 AI 会忘记开头要求，关键约束要重复提醒；</text>
</svg>
