<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="fc-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
  </defs>

  
  <text x="490" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#C2CFE0">两种 DXF 导出器差在哪</text>
  <text x="490" y="74" text-anchor="middle" font-size="14" fill="#DFD3C3">默认 C++ 导出器快但丢东西，旧版 Python 导出器才是全功能</text>

  <!-- 表头 -->
  <rect x="70" y="100" width="860" height="46" rx="10" fill="url(#fc-head)"/>
  <text x="185" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#EFE6DA">功能</text>
  <text x="458" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#EFE6DA">C++ 导出器（默认）</text>
  <text x="772" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#EFE6DA">旧版 Python 导出器</text>

  <!-- 数据行 -->
  <g font-size="15">
    <!-- 行1 -->
    <rect x="70" y="146" width="860" height="44" fill="rgba(255,255,255,0.07)"/>
    <text x="90" y="173" fill="#C2CFE0">文字与标注</text>
    <circle cx="422" cy="168" r="13" fill="rgba(218,98,98,0.20)"/>
    <text x="458" y="173" text-anchor="middle" font-weight="700" fill="#F2B0B0">✗ 不导出</text>
    <circle cx="736" cy="168" r="13" fill="rgba(98,218,161,0.20)"/>
    <text x="772" y="173" text-anchor="middle" font-weight="700" fill="#9EF1BD">✓ 导出</text>

    <!-- 行2 -->
    <rect x="70" y="190" width="860" height="44" fill="rgba(98,138,218,0.20)"/>
    <text x="90" y="217" fill="#C2CFE0">颜色</text>
    <text x="458" y="217" text-anchor="middle" fill="#DFD3C3">✗ 不导出</text>
    <text x="772" y="217" text-anchor="middle" fill="#9EF1BD">✓ 按对象线色</text>

    <!-- 行3 -->
    <rect x="70" y="234" width="860" height="44" fill="rgba(255,255,255,0.07)"/>
    <text x="90" y="261" fill="#C2CFE0">图层</text>
    <text x="458" y="261" text-anchor="middle" fill="#DFD3C3">✓ 按对象名</text>
    <text x="772" y="261" text-anchor="middle" fill="#9EF1BD">✓ 按 Draft 图层/组</text>

    <!-- 行4 -->
    <rect x="70" y="278" width="860" height="44" fill="rgba(98,138,218,0.20)"/>
    <text x="90" y="305" fill="#C2CFE0">组与块</text>
    <text x="458" y="305" text-anchor="middle" fill="#DFD3C3">✗ 不导出</text>
    <text x="772" y="305" text-anchor="middle" fill="#9EF1BD">✓ 导出为块</text>

    <!-- 行5 -->
    <rect x="70" y="322" width="860" height="44" fill="rgba(255,255,255,0.07)"/>
    <text x="90" y="349" fill="#C2CFE0">椭圆 / 样条</text>
    <text x="458" y="349" text-anchor="middle" fill="#9EF1BD">✓ 支持</text>
    <text x="772" y="349" text-anchor="middle" fill="#F2B0B0">✗ 易出问题</text>

    <!-- 行6 -->
    <rect x="70" y="366" width="860" height="44" fill="rgba(98,138,218,0.20)"/>
    <text x="90" y="393" fill="#C2CFE0">速度</text>
    <text x="458" y="393" text-anchor="middle" fill="#9EF1BD">快</text>
    <text x="772" y="393" text-anchor="middle" fill="#F2B0B0">慢</text>
  </g>
  <line x1="70" y1="146" x2="930" y2="146" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="70" y1="190" x2="930" y2="190" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="70" y1="234" x2="930" y2="234" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="70" y1="278" x2="930" y2="278" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="70" y1="322" x2="930" y2="322" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <line x1="70" y1="366" x2="930" y2="366" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>

  <!-- 底部提示 -->
  <rect x="70" y="418" width="860" height="40" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="490" y="443" text-anchor="middle" font-size="14" fill="#E1D3C1">设置：编辑 → 偏好设置 → 导入/导出 → DXF，勾选<span font-weight="700" fill="#AFC6F3">「使用旧版 Python 导出器」</span></text>
</svg>
