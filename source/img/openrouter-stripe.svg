<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
    <linearGradient id="gstripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9A6F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D6C7B2"/>
    </marker>
  </defs>

  
  <text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#C2CFE0">OpenRouter 是怎么工作的</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#DFD3C3">一个 API key 调几百个模型 · 聚合 500+ 模型、80+ 供应商</text>

  <!-- Stripe banner -->
  <rect x="280" y="100" width="640" height="46" rx="10" fill="url(#gstripe)"/>
  <text x="600" y="129" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">据 TechCrunch 报道：Stripe 将以 70 亿美元以上收购 OpenRouter（尚未官宣）</text>

  <!-- app side -->
  <rect x="60" y="200" width="300" height="420" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <rect x="60" y="200" width="300" height="52" rx="14" fill="rgba(98,126,218,0.20)"/>
  <rect x="60" y="238" width="300" height="14" fill="rgba(98,126,218,0.20)"/>
  <text x="210" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#B7C3EB">🧑‍💻 你的应用 / Agent</text>
  <rect x="96" y="272" width="228" height="52" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="210" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">一个 API key</text>
  <text x="210" y="314" text-anchor="middle" font-size="12" fill="#DFD3C3">统一 OpenAI 兼容接口</text>
  <rect x="96" y="344" width="228" height="52" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="210" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">代码只写一次</text>
  <text x="210" y="386" text-anchor="middle" font-size="12" fill="#DFD3C3">切换模型只改一个字符串</text>
  <rect x="96" y="416" width="228" height="52" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="210" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">按量付费 credits</text>
  <text x="210" y="458" text-anchor="middle" font-size="12" fill="#DFD3C3">不用开一堆订阅</text>
  <rect x="96" y="488" width="228" height="52" rx="10" fill="rgba(98,218,190,0.20)" stroke="#82E5D9"/>
  <text x="210" y="512" text-anchor="middle" font-size="14" font-weight="600" fill="#AFF4EE">免费模型随便试</text>
  <text x="210" y="530" text-anchor="middle" font-size="12" fill="#AFF4EE">小模型几毛钱一次</text>
  <rect x="96" y="560" width="228" height="40" rx="10" fill="rgba(218,98,98,0.20)" stroke="#F2A6A6"/>
  <text x="210" y="585" text-anchor="middle" font-size="13" font-weight="600" fill="#F3AFAF">⚠ 国内直连不稳定，需代理</text>

  <!-- arrow app -> OR -->
  <line x1="360" y1="400" x2="436" y2="400" stroke="#D6C7B2" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- OpenRouter center -->
  <rect x="442" y="240" width="316" height="340" rx="14" fill="rgba(255,255,255,0.07)" stroke="#BEADEB" stroke-width="2.5"/>
  <rect x="442" y="240" width="316" height="52" rx="14" fill="url(#g2)"/>
  <rect x="442" y="278" width="316" height="14" fill="url(#g2)"/>
  <text x="600" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#EFE6DA">⚡ OpenRouter 网关</text>
  <rect x="472" y="306" width="256" height="48" rx="10" fill="rgba(98,126,218,0.20)"/>
  <text x="600" y="327" text-anchor="middle" font-size="14" font-weight="600" fill="#B7C3EB">模型路由</text>
  <text x="600" y="345" text-anchor="middle" font-size="12" fill="#DFD3C3">自动挑模型 / 挑供应商</text>
  <rect x="472" y="364" width="256" height="48" rx="10" fill="rgba(98,126,218,0.20)"/>
  <text x="600" y="385" text-anchor="middle" font-size="14" font-weight="600" fill="#B7C3EB">故障自动切换</text>
  <text x="600" y="403" text-anchor="middle" font-size="12" fill="#DFD3C3">某家挂了换另一家</text>
  <rect x="472" y="422" width="256" height="48" rx="10" fill="rgba(98,126,218,0.20)"/>
  <text x="600" y="443" text-anchor="middle" font-size="14" font-weight="600" fill="#B7C3EB">统一计费与额度</text>
  <text x="600" y="461" text-anchor="middle" font-size="12" fill="#DFD3C3">一个钱包花所有模型</text>
  <rect x="472" y="480" width="256" height="48" rx="10" fill="rgba(98,126,218,0.20)"/>
  <text x="600" y="501" text-anchor="middle" font-size="14" font-weight="600" fill="#B7C3EB">数据策略</text>
  <text x="600" y="519" text-anchor="middle" font-size="12" fill="#DFD3C3">可限制数据只发信任方</text>
  <text x="600" y="565" text-anchor="middle" font-size="12" fill="#DFD3C3">月处理 200T+ token · 1000 万+ 用户</text>

  <!-- arrow OR -> models -->
  <line x1="758" y1="400" x2="834" y2="400" stroke="#D6C7B2" stroke-width="3" marker-end="url(#arrow2)"/>

  <!-- models side -->
  <rect x="840" y="200" width="300" height="420" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <rect x="840" y="200" width="300" height="52" rx="14" fill="rgba(98,126,218,0.20)"/>
  <rect x="840" y="238" width="300" height="14" fill="rgba(98,126,218,0.20)"/>
  <text x="990" y="232" text-anchor="middle" font-size="17" font-weight="700" fill="#B7C3EB">🤖 500+ 模型 · 80+ 供应商</text>
  <rect x="876" y="272" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">Anthropic Claude</text>
  <rect x="876" y="326" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="354" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">OpenAI GPT</text>
  <rect x="876" y="380" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="408" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">Google Gemini</text>
  <rect x="876" y="434" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">DeepSeek / 通义千问</text>
  <rect x="876" y="488" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="516" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">开源小模型（免费）</text>
  <rect x="876" y="542" width="228" height="44" rx="10" fill="rgba(98,158,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="990" y="570" text-anchor="middle" font-size="14" font-weight="600" fill="#E1D3C1">图像 / 视频 / 音频模型</text>

  <text x="600" y="730" text-anchor="middle" font-size="13" fill="#DFD3C3">信息查于 2026-08-17 · 收购消息来自 TechCrunch 报道（reportedly）</text>
</svg>
