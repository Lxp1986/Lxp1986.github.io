  <rect x="40" y="60" width="400" height="300" rx="14" fill="rgba(98,126,218,0.16)" stroke="#A6C0F2" stroke-width="1.5"/>
  <text x="70" y="100" font-size="16" font-weight="700" fill="#B7C3EB">skills/</text>
  <text x="70" y="132" font-size="14" fill="#E1D3C1">├─ nvzhuang-video/</text>
  <text x="70" y="158" font-size="14" fill="#A7B9D2">│   ├─ SKILL.md</text>
  <text x="70" y="184" font-size="14" fill="#A7B9D2">│   ├─ xuanpin.md</text>
  <text x="70" y="210" font-size="14" fill="#A7B9D2">│   └─ shipin.md …</text>
  <text x="70" y="236" font-size="14" fill="#E1D3C1">├─ team/</text>
  <text x="70" y="262" font-size="14" fill="#E1D3C1">├─ minfadian/</text>
  <text x="70" y="288" font-size="14" fill="#A7B9D2">├─ …（共 12 个）</text>
  <text x="70" y="322" font-size="14" font-weight="700" fill="#9EF1BD">└─ skills.json ← 机器可读索引</text>

  <!-- 右：skills.json 片段 -->
  <rect x="470" y="60" width="390" height="300" rx="14" fill="rgba(158,241,189,0.10)" stroke="#9EF1BD" stroke-width="1.5"/>
  <text x="500" y="100" font-size="16" font-weight="700" fill="#9EF1BD">skills.json（示意）</text>
  <text x="500" y="134" font-size="13" fill="#A7B9D2">{</text>
  <text x="500" y="160" font-size="13" fill="#A7B9D2">"name": "nvzhuang-video",</text>
  <text x="500" y="186" font-size="13" fill="#A7B9D2">"path": "nvzhuang-video/",</text>
  <text x="500" y="212" font-size="13" fill="#A7B9D2">"files": [</text>
  <text x="500" y="238" font-size="13" fill="#A7B9D2">"SKILL.md",</text>
  <text x="500" y="264" font-size="13" fill="#A7B9D2">"xuanpin.md", "shipin.md",</text>
  <text x="500" y="290" font-size="13" fill="#A7B9D2">"tuiguang.md"</text>
  <text x="500" y="316" font-size="13" fill="#A7B9D2">]</text>
  <text x="500" y="342" font-size="13" fill="#A7B9D2">}</text>

  <text x="450" y="388" text-anchor="middle" font-size="13" fill="#DFD3C3">agent 读索引定位 skill，不用猜目录结构</text>
</svg>
