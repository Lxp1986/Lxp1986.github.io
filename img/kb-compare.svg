  <rect x="386" y="388" width="150" height="50" rx="8" fill="rgba(218,164,98,0.20)"/><text x="461" y="418" text-anchor="middle" font-size="16" fill="#F2C4A2">✗</text>
  <rect x="544" y="388" width="150" height="50" rx="8" fill="rgba(98,218,190,0.20)"/><text x="619" y="418" text-anchor="middle" font-size="16" fill="#AFF4EE">✗</text>
