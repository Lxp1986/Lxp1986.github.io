<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  
  <!-- 节点1: 本地 -->
  <rect x="16" y="90" width="130" height="70" rx="8" fill="rgba(255,255,255,0.07)" stroke="#BECBDA" stroke-width="1.5"/>
  <text x="81" y="116" text-anchor="middle" font-size="14" fill="#DDC29C">本地仓库 main</text>
  <text x="81" y="139" text-anchor="middle" font-size="13" fill="#AFC4F4" font-family="Menlo, monospace">git push</text>
  <!-- 箭头1 -->
  <line x1="146" y1="125" x2="190" y2="125" stroke="#88A8EE" stroke-width="2"/>
  <polygon points="190,119 203,125 190,131" fill="#88A8EE"/>
  <!-- 节点2: Actions -->
  <rect x="205" y="20" width="250" height="210" rx="8" fill="rgba(255,255,255,0.07)" stroke="#88A8EE" stroke-width="1.5"/>
  <text x="330" y="46" text-anchor="middle" font-size="14" fill="#DDC29C" font-weight="bold">GitHub Actions 流水线</text>
  <rect x="220" y="60" width="220" height="26" rx="6" fill="rgba(98,126,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="330" y="78" text-anchor="middle" font-size="12" fill="#DDC29C">checkout 拉源码</text>
  <rect x="220" y="92" width="220" height="26" rx="6" fill="rgba(98,126,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="330" y="110" text-anchor="middle" font-size="12" fill="#DDC29C">setup-node + cache: npm</text>
  <rect x="220" y="124" width="220" height="26" rx="6" fill="rgba(98,126,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="330" y="142" text-anchor="middle" font-size="12" fill="#DDC29C">npm ci 装依赖</text>
  <rect x="220" y="156" width="220" height="26" rx="6" fill="rgba(98,126,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="330" y="174" text-anchor="middle" font-size="12" fill="#DDC29C" font-family="Menlo, monospace">hexo clean &amp;&amp; generate</text>
  <rect x="220" y="188" width="220" height="26" rx="6" fill="rgba(98,218,139,0.20)" stroke="#A6F2C1"/>
  <text x="330" y="206" text-anchor="middle" font-size="12" fill="#B4EECA">public/ 推到 gh-pages 分支</text>
  <!-- 箭头2 -->
  <line x1="455" y1="125" x2="499" y2="125" stroke="#88A8EE" stroke-width="2"/>
  <polygon points="499,119 512,125 499,131" fill="#88A8EE"/>
  <!-- 节点3: 访客 -->
  <rect x="514" y="90" width="130" height="70" rx="8" fill="rgba(255,255,255,0.07)" stroke="#BECBDA" stroke-width="1.5"/>
  <text x="579" y="116" text-anchor="middle" font-size="14" fill="#DDC29C">gh-pages 上线</text>
  <text x="579" y="139" text-anchor="middle" font-size="13" fill="#9EF1BD">访客看到新文章</text>
  <!-- 底部说明 -->
  <text x="16" y="240" font-size="12" fill="#DFD3C3">发布 = 一次 git push；构建、部署全程在 Actions 里完成，本地不用装 hexo 也不用配 token</text>
</svg>
