<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  
  <!-- 节点1: 扫描件PDF -->
  <rect x="20" y="70" width="170" height="100" rx="8" fill="rgba(255,255,255,0.07)" stroke="#BECBDA" stroke-width="1.5"/>
  <text x="105" y="98" text-anchor="middle" font-size="14" fill="#DDC29C" font-weight="bold">扫描件 PDF</text>
  <text x="105" y="122" text-anchor="middle" font-size="13" fill="#DFD3C3">只有图片层</text>
  <text x="105" y="144" text-anchor="middle" font-size="13" fill="#F2B0B0">搜不到 复制不了</text>
  <!-- 箭头1 -->
  <line x1="190" y1="120" x2="235" y2="120" stroke="#88A8EE" stroke-width="2"/>
  <polygon points="235,114 248,120 235,126" fill="#88A8EE"/>
  <!-- 节点2: ocrmypdf 命令 -->
  <rect x="250" y="50" width="200" height="140" rx="8" fill="rgba(255,255,255,0.07)" stroke="#88A8EE" stroke-width="1.5"/>
  <text x="350" y="76" text-anchor="middle" font-size="14" fill="#DDC29C" font-weight="bold">ocrmypdf</text>
  <rect x="262" y="88" width="176" height="60" rx="6" fill="rgba(98,126,218,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="350" y="112" text-anchor="middle" font-size="12" fill="#DDC29C" font-family="Menlo, monospace">-l chi_sim+eng</text>
  <text x="350" y="134" text-anchor="middle" font-size="12" fill="#DDC29C" font-family="Menlo, monospace">--image-dpi 300</text>
  <!-- 箭头2 -->
  <line x1="450" y1="120" x2="495" y2="120" stroke="#88A8EE" stroke-width="2"/>
  <polygon points="495,114 508,120 495,126" fill="#88A8EE"/>
  <!-- 节点3: 输出 -->
  <rect x="510" y="70" width="170" height="100" rx="8" fill="rgba(255,255,255,0.07)" stroke="#A6F2C1" stroke-width="1.5"/>
  <text x="595" y="98" text-anchor="middle" font-size="14" fill="#DDC29C" font-weight="bold">可搜索 PDF</text>
  <text x="595" y="122" text-anchor="middle" font-size="13" fill="#DFD3C3">图片层 + 文字层</text>
  <text x="595" y="144" text-anchor="middle" font-size="13" fill="#B4EECA">能搜 能复制 可归档</text>
  <!-- 坑提示 -->
  <rect x="250" y="210" width="430" height="42" rx="6" fill="rgba(218,98,98,0.20)" stroke="rgba(255,255,255,0.22)"/>
  <text x="262" y="230" font-size="12" fill="#EE9C9C">坑1：brew 的 tesseract 默认没有 chi_sim，要补语言包</text>
  <text x="262" y="246" font-size="12" fill="#EE9C9C">坑2：图片输入无 DPI 会报 DpiError，加 --image-dpi 300</text>
</svg>
