nav:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-house
  归档: /archives/ || fas fa-box-archive
  分类: /categories/ || fas fa-folder-tree
  标签: /tags/ || fas fa-tags
  留言板: /message/ || fas fa-message
  关于: /about/ || fas fa-user

favicon: /img/levi-avatar.svg

social_preview: /img/og.jpg

avatar:
  img: /img/levi-avatar.svg
  effect: false

disable_top_img: true
index_img: false
default_top_img: false

cover:
  index_enable: false
  aside_enable: false
  archives_enable: false

background: "#f7f0e4"

subtitle:
  enable: true
  effect: false
  sub:
    - 三色风，记录生活与热爱
    - 旅游、情感、技术与投资
    - 在变化中保持清醒与温度

social:
  fab fa-github: https://github.com/Lxp1986 || GitHub || '#24292e'
  fas fa-rss: /atom.xml || RSS || '#b85c38'

index_layout: 3
index_post_content:
  method: 3
  length: 180

toc:
  post: true
  page: true
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://www.lxpyll.top
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: true
  text: 打赏
  QR_code:
    - img: /img/wechat-reward-qr.jpg
      text: 微信支付
    - img: /img/alipay-reward-qr.jpg
      text: 支付宝

comments:
  use: giscus
  text: true
  lazyload: false
  count: false
  card_post_count: false

# 评论系统：giscus（基于 GitHub Discussions，数据存在本仓库，零成本零维护）
# 使用前需先在 https://github.com/apps/giscus 授权安装 giscus App 到本仓库
giscus:
  repo: Lxp1986/Lxp1986.github.io
  repo_id: R_kgDOMn0qqg
  category_id: DIC_kwDOMn0qqs4DDgMy
  light_theme: light
  dark_theme: dark

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: Levi的Blog
    button:
      enable: true
      icon: fab fa-github
      text: 访问 GitHub
      link: https://github.com/Lxp1986
  card_announcement:
    enable: true
    content: 欢迎来到我的博客，持续更新中。
  card_recent_post:
    enable: true
    limit: 5
  card_post_series:
    enable: true
    series_title: true
    orderBy: title
    order: 1
    limit: 12
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 30
  card_archives:
    enable: true
    type: monthly
    format: YYYY 年 MM 月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    runtime_date: 2026-02-16

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: false
  custom_text: 三色风 | Levi

theme_color:
  enable: true
  main: "#b85c38"
  paginator: "#8b7355"
  button_hover: "#c9a227"
  text_selection: "#e8d4a8"
  link_color: "#a84832"
  meta_color: "#7a6a58"
  hr_color: "#d4b896"
  code_foreground: "#5c4a38"
  code_background: "rgba(201, 162, 39, .12)"
  toc_color: "#8b7355"
  blockquote_padding_color: "#b85c38"
  blockquote_background_color: "rgba(201, 162, 39, .14)"
  scrollbar_color: "#8b7355"
  meta_theme_color_light: "#f7f0e4"
  meta_theme_color_dark: "#231d17"

copy:
  enable: true

readmode: true

rightside_scroll_percent: true

rightside_item_order:
  enable: true
  hide: readmode,translate,hideAside
  show: darkmode,toc,chat,comment

darkmode:
  enable: true
  button: true
  autoChangeMode: false

preloader:
  enable: false

enter_transitions: false

font:
  global_font_size: 16px
  font_family: "Manrope, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
  code_font_family: "JetBrains Mono, Menlo, Monaco, Consolas, monospace"

blog_title_font:
  font_link: https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap
  font_family: "Noto Serif SC, serif"

search:
  use: local_search
  placeholder: 输入关键词搜索文章
  local_search:
    preload: true
    top_n_per_article: 2

busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

series:
  enable: true
  orderBy: title
  order: 1
  number: true

inject:
  head:
    - <script async src="https://www.googletagmanager.com/gtag/js?id=G-78CVHQTCM7"></script>
    - <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-78CVHQTCM7')</script>
    - <link rel="preconnect" href="https://fonts.googleapis.com">
    - <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    - <link rel="stylesheet" href="/css/custom.css?v=20260728-hero-poster-3">
    - <meta name="msvalidate.01" content="C77AD03ECD54E088B341BF1F23909B07">

error_404:
  enable: true
  subtitle: 这阵风走错了方向，页面没有找到
  background: /img/lychee-rose-bouquet.jpg

Open_Graph_meta:
  enable: true
  option:
    twitter_card: summary_large_image
    twitter_image: https://www.lxpyll.top/img/og.jpg

structured_data:
  enable: true
