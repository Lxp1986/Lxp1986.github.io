<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="20" y="20" width="760" height="380" rx="14" fill="#1a1d29" fill-opacity="0.94" stroke="#3a3f55" stroke-width="2"/>
  <text x="60" y="80" font-size="34" font-weight="700" fill="#f2f4fa">token 花在哪</text>

  <g font-size="24" fill="#c6cbd8">
    <text x="60" y="150">输出废话</text>
    <rect x="240" y="126" width="480" height="30" rx="8" fill="#2b3044"/>
    <rect x="240" y="126" width="300" height="30" rx="8" fill="#e26d6d"/>
    <text x="560" y="150" font-size="22" fill="#8a91a5">寒暄 · 重复 · 过度解释</text>

    <text x="60" y="225">重复上下文</text>
    <rect x="240" y="201" width="400" height="30" rx="8" fill="#2b3044"/>
    <rect x="240" y="201" width="200" height="30" rx="8" fill="#e2a86d"/>
    <text x="560" y="225" font-size="22" fill="#8a91a5">记忆文件 · 工具描述</text>

    <text x="60" y="300">试错返工</text>
    <rect x="240" y="276" width="340" height="30" rx="8" fill="#2b3044"/>
    <rect x="240" y="276" width="170" height="30" rx="8" fill="#c9a0e2"/>
    <text x="560" y="300" font-size="22" fill="#8a91a5">任务太大 · 一次返工顶十次</text>
  </g>

  <text x="60" y="368" font-size="22" fill="#6b7288">彩色段 = 可省下来的部分，盯住这三处下手</text>
</svg>
