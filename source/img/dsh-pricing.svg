<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="800" rx="18" fill="#F6F8FB"/>
  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">DeepSeek API 峰谷定价：8 月 17 日起，涨了多少？</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#64748B">单位：元 / 百万 tokens · 高峰 9:00–12:00、14:00–18:00（北京时间），空闲价 = 高峰价 × 0.5</text>

  <!-- 图例 -->
  <rect x="852" y="96" width="18" height="18" rx="4" fill="#94A3B8"/>
  <text x="878" y="110" font-size="14" fill="#334155">旧价（8/17 前）</text>
  <rect x="1010" y="96" width="18" height="18" rx="4" fill="#7C5CD6"/>
  <text x="1036" y="110" font-size="14" fill="#334155">高峰</text>
  <rect x="852" y="124" width="18" height="18" rx="4" fill="#5B8DEF"/>
  <text x="878" y="138" font-size="14" fill="#334155">空闲</text>

  <!-- 绘图区基线 -->
  <line x1="120" y1="620" x2="1120" y2="620" stroke="#334155" stroke-width="2"/>

  <!-- 网格与刻度（最大值 28 元） -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="120" y1="620" x2="1120" y2="620"/>
    <line x1="120" y1="525" x2="1120" y2="525"/>
    <line x1="120" y1="430" x2="1120" y2="430"/>
    <line x1="120" y1="335" x2="1120" y2="335"/>
    <line x1="120" y1="240" x2="1120" y2="240"/>
  </g>
  <g font-size="13" fill="#64748B" text-anchor="end">
    <text x="108" y="624">0</text>
    <text x="108" y="529">7</text>
    <text x="108" y="434">14</text>
    <text x="108" y="339">21</text>
    <text x="108" y="244">28</text>
  </g>

  <!-- Flash 组（中心 x=300；输入簇 210，输出簇 390） -->
  <!-- 输入 旧1.0/高3.0/空1.5 -->
  <rect x="152" y="606.4" width="46" height="13.6" rx="4" fill="#94A3B8"/>
  <text x="175" y="599" text-anchor="middle" font-size="12" fill="#475569">1</text>
  <rect x="206" y="579.3" width="46" height="40.7" rx="4" fill="#7C5CD6"/>
  <text x="229" y="572" text-anchor="middle" font-size="12" fill="#475569">3.0</text>
  <rect x="260" y="599.6" width="46" height="20.4" rx="4" fill="#5B8DEF"/>
  <text x="283" y="592" text-anchor="middle" font-size="12" fill="#475569">1.5</text>
  <!-- 输出 旧2.0/高9.0/空4.5 -->
  <rect x="332" y="592.9" width="46" height="27.1" rx="4" fill="#94A3B8"/>
  <text x="355" y="585" text-anchor="middle" font-size="12" fill="#475569">2</text>
  <rect x="386" y="497.9" width="46" height="122.1" rx="4" fill="#7C5CD6"/>
  <text x="409" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#7C5CD6">9.0</text>
  <rect x="440" y="558.9" width="46" height="61.1" rx="4" fill="#5B8DEF"/>
  <text x="463" y="551" text-anchor="middle" font-size="12" fill="#475569">4.5</text>

  <!-- Pro 组（中心 x=900；输入簇 810，输出簇 990） -->
  <!-- 输入 旧3.0/高9.0/空4.5 -->
  <rect x="752" y="579.3" width="46" height="40.7" rx="4" fill="#94A3B8"/>
  <text x="775" y="572" text-anchor="middle" font-size="12" fill="#475569">3</text>
  <rect x="806" y="497.9" width="46" height="122.1" rx="4" fill="#7C5CD6"/>
  <text x="829" y="490" text-anchor="middle" font-size="12" font-weight="700" fill="#7C5CD6">9.0</text>
  <rect x="860" y="558.9" width="46" height="61.1" rx="4" fill="#5B8DEF"/>
  <text x="883" y="551" text-anchor="middle" font-size="12" fill="#475569">4.5</text>
  <!-- 输出 旧6.0/高27.0/空13.5 -->
  <rect x="932" y="538.6" width="46" height="81.4" rx="4" fill="#94A3B8"/>
  <text x="955" y="531" text-anchor="middle" font-size="12" fill="#475569">6</text>
  <rect x="986" y="253.6" width="46" height="366.4" rx="4" fill="#7C5CD6"/>
  <text x="1009" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#7C5CD6">27.0</text>
  <rect x="1040" y="436.8" width="46" height="183.2" rx="4" fill="#5B8DEF"/>
  <text x="1063" y="429" text-anchor="middle" font-size="12" fill="#475569">13.5</text>

  <!-- X 轴标签 -->
  <text x="210" y="644" text-anchor="middle" font-size="13.5" fill="#334155">输入（缓存未命中）</text>
  <text x="390" y="644" text-anchor="middle" font-size="13.5" fill="#334155">输出</text>
  <text x="810" y="644" text-anchor="middle" font-size="13.5" fill="#334155">输入（缓存未命中）</text>
  <text x="990" y="644" text-anchor="middle" font-size="13.5" fill="#334155">输出</text>
  <text x="300" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2A3B">deepseek-v4-flash</text>
  <text x="900" y="676" text-anchor="middle" font-size="16" font-weight="700" fill="#1E2A3B">deepseek-v4-pro</text>

  <!-- 批注 -->
  <rect x="70" y="698" width="1060" height="78" rx="12" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="600" y="726" text-anchor="middle" font-size="15" font-weight="700" fill="#C2410C">输出比输入涨得更狠：Flash 输出 2 → 9 元，Pro 输出 6 → 27 元（高峰，均为 4.5 倍）；Pro 输出高峰价是 Flash 的 3 倍</text>
  <text x="600" y="752" text-anchor="middle" font-size="13.5" fill="#9A3412">缓存命中输入另有低价（Flash 0.05/0.10 元，Pro 0.15/0.30 元），未在图中列出；旧价为 8 月 17 日调价前价格</text>
  <text x="600" y="772" text-anchor="middle" font-size="12" fill="#64748B">数据来源：api-docs.deepseek.com（查询于 2026-08-16）· 新价格 2026-08-17 00:00（北京时间）起生效 · 元/百万 tokens</text>
</svg>
