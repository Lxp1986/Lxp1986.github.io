<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b85c38"/><stop offset="1" stop-color="#6f4b9b"/></linearGradient></defs>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#5c4a38">Paperclip 与其他 Agent 工具的层级</text>
<rect x="120" y="95" width="960" height="100" rx="25" fill="rgba(255,255,255,0.07)" stroke="url(#g)" stroke-width="5"/><text x="600" y="137" text-anchor="middle" font-size="27" font-weight="700" fill="#6f4b9b">Paperclip：目标、组织、预算、治理</text><text x="600" y="172" text-anchor="middle" font-size="19" fill="#7a6a58">把多个 Agent 放进同一套管理关系</text>
<path d="M600 205 V245" stroke="#b85c38" stroke-width="5"/>
<rect x="120" y="250" width="960" height="100" rx="25" fill="rgba(255,255,255,0.07)" stroke="#c9a227" stroke-width="4"/><text x="600" y="292" text-anchor="middle" font-size="27" font-weight="700" fill="#8d6b18">Agent 运行层</text><text x="600" y="327" text-anchor="middle" font-size="19" fill="#7a6a58">Codex · Claude Code · Hermes · 其他运行时</text>
<path d="M600 360 V400" stroke="#b85c38" stroke-width="5"/>
<rect x="120" y="405" width="960" height="100" rx="25" fill="rgba(255,255,255,0.07)" stroke="#3b82a0" stroke-width="4"/><text x="600" y="447" text-anchor="middle" font-size="27" font-weight="700" fill="#286279">工具与环境层</text><text x="600" y="482" text-anchor="middle" font-size="19" fill="#7a6a58">终端 · 浏览器 · Git · 文件 · API · 数据库</text>
<rect x="120" y="555" width="960" height="60" rx="18" fill="rgba(201,162,39,0.10)" stroke="#d4b896" stroke-width="3"/><text x="600" y="593" text-anchor="middle" font-size="21" fill="#7a6a58">Paperclip 不替代模型，也不替你承担权限和结果风险</text>
</g></svg>