<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  
  <rect x="10" y="10" width="620" height="410" rx="8" fill="none" stroke="#D6C7B2"/>

  <!-- 设备A -->
  <rect x="40" y="50" width="200" height="64" rx="6" fill="rgba(255,255,255,0.07)" stroke="#DDCDB8" stroke-width="1.5"/>
  <text x="140" y="76" text-anchor="middle" font-size="14" fill="#E1D3C1">设备A：MacBook</text>
  <text x="140" y="98" text-anchor="middle" font-size="12" fill="#DFD3C3">正在编辑 note.md</text>

  <!-- 设备B -->
  <rect x="400" y="50" width="200" height="64" rx="6" fill="rgba(255,255,255,0.07)" stroke="#DDCDB8" stroke-width="1.5"/>
  <text x="500" y="76" text-anchor="middle" font-size="14" fill="#E1D3C1">设备B：脚本 / 另一台机器</text>
  <text x="500" y="98" text-anchor="middle" font-size="12" fill="#DFD3C3">也在写 note.md</text>

  <!-- 箭头到云 -->
  <path d="M140 114 L140 148 L215 148" fill="none" stroke="#D6C7B2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M500 114 L500 148 L425 148" fill="none" stroke="#D6C7B2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#EEB9B4">几乎同时保存，互相没看到对方的版本</text>

  <!-- iCloud 云 -->
  <g transform="translate(215,155)">
    <ellipse cx="105" cy="40" rx="105" ry="36" fill="rgba(98,163,218,0.20)" stroke="#B7CFE1" stroke-width="1.5"/>
    <ellipse cx="70" cy="22" rx="42" ry="24" fill="rgba(98,163,218,0.20)" stroke="#B7CFE1" stroke-width="1.5"/>
    <ellipse cx="140" cy="24" rx="38" ry="22" fill="rgba(98,163,218,0.20)" stroke="#B7CFE1" stroke-width="1.5"/>
    <text x="105" y="46" text-anchor="middle" font-size="15" fill="#B7D3EB">iCloud Drive</text>
  </g>

  <!-- 云到结果 -->
  <path d="M275 233 L170 290" fill="none" stroke="#D6C7B2" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M365 233 L460 290" fill="none" stroke="#D6C7B2" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 结果文件 -->
  <rect x="55" y="295" width="190" height="58" rx="6" fill="rgba(255,255,255,0.07)" stroke="#7BAF7B" stroke-width="1.5"/>
  <text x="150" y="318" text-anchor="middle" font-size="14" fill="#E1D3C1">note.md</text>
  <text x="150" y="340" text-anchor="middle" font-size="12" fill="#C1D9C1">原版保留</text>

  <rect x="395" y="295" width="190" height="58" rx="6" fill="rgba(255,255,255,0.07)" stroke="#DF7C72" stroke-width="1.5"/>
  <text x="490" y="318" text-anchor="middle" font-size="14" fill="#E1D3C1">note 2.md</text>
  <text x="490" y="340" text-anchor="middle" font-size="12" fill="#EEB9B4">iCloud 自动改名，不提示</text>

  <text x="320" y="392" text-anchor="middle" font-size="13" fill="#E1D3C1">iCloud 不合并、不提示，两个版本都留着，冲突副本就这样产生</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#D6C7B2"/>
    </marker>
  </defs>
</svg>
