<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="cp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="880" rx="18" fill="#F6F8FB"/>
  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">Agent 框架横评：定位象限图</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#64748B">横轴：生态成熟度（star、插件数、稳定性）　纵轴：插件化 / 可定制性——越靠右上越"可塑"，越靠右下越"省心"</text>

  <!-- 象限坐标区 -->
  <rect x="100" y="110" width="720" height="620" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="460" y1="130" x2="460" y2="710" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="120" y1="420" x2="800" y2="420" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="820" y="418" font-size="13" font-weight="700" fill="#1E2A3B">生态成熟度 →</text>
  <text x="96" y="150" font-size="13" font-weight="700" fill="#1E2A3B">可定制性 ↑</text>

  <!-- 象限标签 -->
  <text x="290" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">深度玩家区</text>
  <text x="290" y="200" text-anchor="middle" font-size="11.5" fill="#64748B">高可定制 · 生态尚在成长</text>
  <text x="630" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">成熟主力区</text>
  <text x="630" y="200" text-anchor="middle" font-size="11.5" fill="#64748B">高可定制 · 生态成熟</text>
  <text x="290" y="660" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">轻量工具区</text>
  <text x="290" y="680" text-anchor="middle" font-size="11.5" fill="#64748B">轻量够用 · 生态一般</text>
  <text x="630" y="660" text-anchor="middle" font-size="14" font-weight="700" fill="#854D0E">省心即用区</text>
  <text x="630" y="680" text-anchor="middle" font-size="11.5" fill="#64748B">开箱即用 · 生态成熟</text>

  <!-- 数据点 -->
  <g>
    <circle cx="560" cy="270" r="17" fill="#5B8DEF" stroke="#fff" stroke-width="3"/>
