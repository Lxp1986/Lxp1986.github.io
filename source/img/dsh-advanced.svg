<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="ad-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CD6"/>
    </linearGradient>
    <marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="18" fill="#F6F8FB"/>
  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">Harness 进阶：微内核与扩展点全景</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#64748B">产品功能 = 扩展点上的监听器——没有任何一行修改循环本身；插件热重载（HMR）随仓库提供</text>

  <!-- 中心：Agent Loop -->
  <rect x="380" y="210" width="440" height="220" rx="16" fill="url(#ad-core)"/>
  <text x="600" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Agent Loop（微内核，不可直接修改）</text>
  <text x="600" y="282" text-anchor="middle" font-size="13" fill="#E0E7FF">每轮 = 模型请求 + 若干工具调用</text>
  <text x="600" y="306" text-anchor="middle" font-size="13" fill="#E0E7FF">会话日志"模型可见即已记录"</text>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="#E0E7FF">事件流：session/event · turn/end</text>
  <text x="600" y="354" text-anchor="middle" font-size="13" fill="#E0E7FF">followup() / steer() 驱动输入</text>
  <text x="600" y="378" text-anchor="middle" font-size="13" fill="#E0E7FF">fork 回放 · 会话恢复 · 事件可审计</text>

  <!-- 顶部扩展点 -->
  <rect x="110" y="112" width="290" height="70" rx="10" fill="#EEF2FF"/>
  <text x="255" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">🔌 工具注册 ctx.tools.register()</text>
  <text x="255" y="162" text-anchor="middle" font-size="11.5" fill="#475569">defineTool · 原始 JSON Schema · MCP 工具</text>
  <line x1="330" y1="182" x2="470" y2="218" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="450" y="112" width="300" height="70" rx="10" fill="#F0FDFA"/>
  <text x="600" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">🛡️ 钩子/权限门禁（waterfall）</text>
  <text x="600" y="162" text-anchor="middle" font-size="11.5" fill="#475569">tools/pre-execute → deny/ask/next</text>
  <line x1="600" y1="182" x2="600" y2="206" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="800" y="112" width="290" height="70" rx="10" fill="#FDF2F8"/>
  <text x="945" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">🖥️ UI 插件 session/event</text>
  <text x="945" y="162" text-anchor="middle" font-size="11.5" fill="#475569">assistant/chunk → 渲染 · 输入 → followup</text>
  <line x1="870" y1="182" x2="730" y2="218" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <!-- 左侧扩展点 -->
  <rect x="110" y="320" width="240" height="86" rx="10" fill="#EEF2FF"/>
  <text x="230" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3B5BC9">🧩 Subagent 提供方注册表</text>
  <text x="230" y="366" text-anchor="middle" font-size="11" fill="#475569">in-process / fork / acp</text>
  <text x="230" y="384" text-anchor="middle" font-size="11" fill="#475569">codex / claude-code / dsh-sdk</text>
  <line x1="354" y1="350" x2="376" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="110" y="430" width="240" height="86" rx="10" fill="#F0FDFA"/>
  <text x="230" y="454" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0B8E82">⏰ 调度 Schedule</text>
  <text x="230" y="476" text-anchor="middle" font-size="11" fill="#475569">schedule_create/delete/list</text>
  <text x="230" y="494" text-anchor="middle" font-size="11" fill="#475569">after / at / every（≥300s）</text>
  <line x1="354" y1="470" x2="376" y2="450" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <!-- 右侧扩展点 -->
  <rect x="850" y="320" width="240" height="86" rx="10" fill="#FDF2F8"/>
  <text x="970" y="344" text-anchor="middle" font-size="13.5" font-weight="700" fill="#A21CAF">📦 组合包 Bundle 层</text>
  <text x="970" y="366" text-anchor="middle" font-size="11" fill="#475569">dsh.bundle manifest 声明 patch</text>
  <text x="970" y="384" text-anchor="middle" font-size="11" fill="#475569">dsh plugin --profile add 安装</text>
  <line x1="846" y1="350" x2="824" y2="330" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="850" y="430" width="240" height="86" rx="10" fill="#FEF9C3"/>
  <text x="970" y="454" text-anchor="middle" font-size="13.5" font-weight="700" fill="#854D0E">🧠 能力 Seam（可替换）</text>
  <text x="970" y="476" text-anchor="middle" font-size="11" fill="#475569">模型适配器 · 文件系统 · 沙箱</text>
  <text x="970" y="494" text-anchor="middle" font-size="11" fill="#475569">上下文压缩 · 系统提示词组装</text>
  <line x1="846" y1="470" x2="824" y2="450" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <!-- 底部扩展点 -->
  <rect x="110" y="540" width="290" height="86" rx="10" fill="#EEF2FF"/>
  <text x="255" y="564" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3B5BC9">🔄 动态插件 cordis_define / run / stop</text>
  <text x="255" y="586" text-anchor="middle" font-size="11" fill="#475569">模型运行中自定义、启动、停止插件</text>
  <text x="255" y="604" text-anchor="middle" font-size="11" fill="#475569">需要显式选择启用（vm 沙箱）</text>
  <line x1="360" y1="560" x2="460" y2="520" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="450" y="540" width="300" height="86" rx="10" fill="#F0FDFA"/>
  <text x="600" y="564" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0B8E82">📜 上下文压缩 seam</text>
  <text x="600" y="586" text-anchor="middle" font-size="11" fill="#475569">自动：agent/pre-step 压力检查</text>
  <text x="600" y="604" text-anchor="middle" font-size="11" fill="#475569">溢出恢复：agent/request-error · 手动同服务</text>
  <line x1="600" y1="540" x2="600" y2="434" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <rect x="800" y="540" width="290" height="86" rx="10" fill="#FDF2F8"/>
  <text x="945" y="564" text-anchor="middle" font-size="13.5" font-weight="700" fill="#A21CAF">⚙️ 后台任务 ctx.jobs</text>
  <text x="945" y="586" text-anchor="middle" font-size="11" fill="#475569">bash 后台 · PTY 发送 · subagent</text>
  <text x="945" y="604" text-anchor="middle" font-size="11" fill="#475569">job_list / job_output 收集结果</text>
  <line x1="840" y1="560" x2="740" y2="520" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>

  <!-- 底部：配置层顺序 -->
  <text x="80" y="680" font-size="17" font-weight="700" fill="#7C5CD6">生效配置层顺序（后层覆盖前层，patch 整行替换 config，不深度合并）</text>
  <rect x="80" y="696" width="190" height="62" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="175" y="720" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E2A3B">① bundles 列表</text>
  <text x="175" y="740" text-anchor="middle" font-size="10.5" fill="#475569">dsh-base → 各组合包</text>
  <line x1="274" y1="727" x2="304" y2="727" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>
  <rect x="310" y="696" width="190" height="62" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="405" y="720" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E2A3B">② profile patch</text>
  <text x="405" y="740" text-anchor="middle" font-size="10.5" fill="#475569">$DSH_HOME/profiles/&lt;name&gt;/cordis.patch.yml</text>
  <line x1="504" y1="727" x2="534" y2="727" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>
  <rect x="540" y="696" width="190" height="62" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="635" y="720" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1E2A3B">③ home patch</text>
  <text x="635" y="740" text-anchor="middle" font-size="10.5" fill="#475569">$DSH_HOME/cordis.patch.yml（各 profile 共享）</text>
  <line x1="734" y1="727" x2="764" y2="727" stroke="#94A3B8" stroke-width="2" marker-end="url(#ad-arrow)"/>
  <rect x="770" y="696" width="190" height="62" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="865" y="720" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0B8E82">④ --patch overlay</text>
  <text x="865" y="740" text-anchor="middle" font-size="10.5" fill="#475569">按 argv 顺序，优先级最高</text>
  <rect x="985" y="696" width="130" height="62" rx="10" fill="#FEF9C3" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="1050" y="720" text-anchor="middle" font-size="12.5" font-weight="700" fill="#854D0E">体检</text>
  <text x="1050" y="740" text-anchor="middle" font-size="10.5" font-family="Menlo,Consolas,monospace" fill="#475569">--dump-config</text>

  <!-- 底部：踩坑速记 -->
  <text x="80" y="806" font-size="17" font-weight="700" fill="#7C5CD6">踩坑速记（详见正文）</text>
  <text x="80" y="838" font-size="12.5" fill="#475569">① !!js 表达式只在插件 config 内求值（postmortem 0002）　② CLI 不支持 --host 0.0.0.0　③ git 安装插件要 allowBuilds 授权　④ schedule 仅 session-local、无 Cron　⑤ patch 整行替换 config，覆盖时须重述全部键</text>
  <text x="80" y="864" font-size="12.5" fill="#475569">⑥ API Key 只写不读回，明文在 .credentials.yaml　⑦ 自定义视觉模型要声明 input: [text, image]　⑧ headless 退出码 0/1　⑨ SIGTERM=0 / SIGINT=130 / 二次信号强杀</text>
</svg>
