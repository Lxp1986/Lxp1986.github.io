    <text x="560" y="316" text-anchor="middle" font-size="11.5" fill="#475569">12.7 万星 · 开发者预览 · 一切皆插件</text>
  </g>
  <g>
    <circle cx="655" cy="380" r="15" fill="#E2A63B" stroke="#fff" stroke-width="3"/>
    <text x="655" y="356" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">Claude Code</text>
    <text x="655" y="412" text-anchor="middle" font-size="11.5" fill="#475569">14.2 万星 · 专有 · 终端 Agent 标杆</text>
  </g>
  <g>
    <circle cx="600" cy="500" r="15" fill="#10B981" stroke="#fff" stroke-width="3"/>
