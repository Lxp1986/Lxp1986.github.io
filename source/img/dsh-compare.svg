  <text x="880" y="396" font-size="11.5" fill="#475569">上手 4.5 · 成本 3.5 · 稳定 4.0</text>
  <line x1="880" y1="410" x2="1140" y2="410" stroke="#E2E8F0" stroke-width="1"/>

  <text x="880" y="438" font-size="13" font-weight="700" fill="#1E2A3B">OpenHands 总分 21.5</text>
  <text x="880" y="462" font-size="11.5" fill="#475569">功能 4.0 · 架构 4.0 · 生态 3.5</text>
  <text x="880" y="482" font-size="11.5" fill="#475569">上手 3.5 · 成本 3.5 · 稳定 3.0</text>
  <line x1="880" y1="496" x2="1140" y2="496" stroke="#E2E8F0" stroke-width="1"/>

  <text x="880" y="524" font-size="13" font-weight="700" fill="#1E2A3B">Gemini CLI 总分 22.5</text>
  <text x="880" y="548" font-size="11.5" fill="#475569">功能 4.0 · 架构 3.5 · 生态 4.5</text>
  <text x="880" y="568" font-size="11.5" fill="#475569">上手 4.5 · 成本 3.5 · 稳定 4.0</text>
  <line x1="880" y1="582" x2="1140" y2="582" stroke="#E2E8F0" stroke-width="1"/>

  <text x="880" y="610" font-size="13" font-weight="700" fill="#1E2A3B">Aider 总分 19.5</text>
  <text x="880" y="634" font-size="11.5" fill="#475569">功能 3.5 · 架构 3.0 · 生态 4.0</text>
  <text x="880" y="654" font-size="11.5" fill="#475569">上手 4.5 · 成本 3.5 · 稳定 4.0</text>
  <line x1="880" y1="668" x2="1140" y2="668" stroke="#E2E8F0" stroke-width="1"/>

  <text x="880" y="696" font-size="11.5" fill="#64748B">打分是个人综合判断，供横向参考；</text>
  <text x="880" y="714" font-size="11.5" fill="#64748B">成熟度与价格请以各官方最新信息为准。</text>
