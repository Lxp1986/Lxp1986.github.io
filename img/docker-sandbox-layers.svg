<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"><text x="600" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#E7DCCF">沙箱隔离的四道边界</text><path d="M250 128V580" stroke="#79C8FF" stroke-width="3"/><g><circle cx="250" cy="166" r="22" fill="rgba(121,200,255,.12)" stroke="#79C8FF" stroke-width="3"/><circle cx="250" cy="280" r="22" fill="rgba(201,167,255,.12)" stroke="#C9A7FF" stroke-width="3"/><circle cx="250" cy="394" r="22" fill="rgba(228,197,122,.12)" stroke="#E4C57A" stroke-width="3"/><circle cx="250" cy="508" r="22" fill="rgba(121,215,209,.12)" stroke="#79D7D1" stroke-width="3"/></g><g><text x="310" y="158" font-size="24" font-weight="700" fill="#A9D9FF">文件系统</text><text x="310" y="190" font-size="18" fill="#B9A995">只共享完成任务所需的工作目录</text><text x="310" y="272" font-size="24" font-weight="700" fill="#D8B8FF">网络访问</text><text x="310" y="304" font-size="18" fill="#B9A995">根据任务开放必要的出站目标</text><text x="310" y="386" font-size="24" font-weight="700" fill="#E4C57A">凭证权限</text><text x="310" y="418" font-size="18" fill="#B9A995">使用最小权限、短时有效的凭证</text><text x="310" y="500" font-size="24" font-weight="700" fill="#79D7D1">生命周期与审计</text><text x="310" y="532" font-size="18" fill="#B9A995">能停止、清理，并回看执行记录</text></g><path d="M770 167H890M770 281H890M770 395H890M770 509H890" stroke="#536577" stroke-width="2"/><g fill="none" stroke-width="3"><path d="M920 145h110v44H920z" stroke="#79C8FF"/><path d="M920 259h110v44H920z" stroke="#C9A7FF"/><path d="M920 373h110v44H920z" stroke="#E4C57A"/><path d="M920 487h110v44H920z" stroke="#79D7D1"/></g><text x="600" y="620" text-anchor="middle" font-size="19" fill="#E7DCCF">容器/微虚拟机只是隔离手段，边界仍取决于实际配置</text></g></svg>