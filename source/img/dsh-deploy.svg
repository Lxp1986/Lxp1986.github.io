<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="dp-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CD6"/>
    </linearGradient>
    <linearGradient id="dp-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A3B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <marker id="dp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="900" rx="18" fill="#F6F8FB"/>
  <text x="600" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">DeepSeek Harness 部署拓扑：三条路径 + 多 Provider</text>
  <text x="600" y="76" text-anchor="middle" font-size="15" fill="#64748B">本机 npx / Docker 容器 / VPS 守护进程，模型提供方与凭据全部可配——命令逐条可复制</text>

  <!-- ============ 左列：三条部署路径 ============ -->
  <text x="80" y="116" font-size="17" font-weight="700" fill="#7C5CD6">路径一 · 本机（5 分钟）</text>
  <rect x="80" y="128" width="520" height="176" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="100" y="148" width="480" height="34" rx="8" fill="#EEF2FF"/>
  <text x="110" y="170" font-size="13.5" font-family="Menlo,Consolas,monospace" fill="#3B5BC9">npx @deepseek-ai/dsh web</text>
  <text x="592" y="170" text-anchor="end" font-size="12" fill="#64748B">→ http://127.0.0.1:3080</text>
  <text x="100" y="206" font-size="12.5" fill="#475569">· 环境要求：Node.js ≥ 22.19（源码仓库 engines 声明，npm 包 0.1.0-rc.6）</text>
  <text x="100" y="228" font-size="12.5" fill="#475569">· 首次启动自动初始化 web profile（base + web-app 组合包）</text>
  <text x="100" y="250" font-size="12.5" fill="#475569">· 配置目录 $DSH_HOME（默认 ~/.dsh）：.credentials.yaml / settings.yaml / profiles/</text>
  <text x="100" y="272" font-size="12.5" fill="#475569">· 冒烟验证：dsh --profile headless "say hi"（跑完即退出，不占端口）</text>

  <text x="80" y="334" font-size="17" font-weight="700" fill="#7C5CD6">路径二 · Docker（隔离/CI）</text>
  <rect x="80" y="346" width="520" height="176" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="100" y="366" width="480" height="34" rx="8" fill="#EEF2FF"/>
  <text x="110" y="388" font-size="13.5" font-family="Menlo,Consolas,monospace" fill="#3B5BC9">docker build -t dsh . && docker run -d -p 3080:3080 -v dsh-home:/root/.dsh dsh</text>
  <text x="100" y="424" font-size="12.5" fill="#475569">· 官方暂无镜像/Dockerfile → 社区自建：node:22-slim + npm i -g @deepseek-ai/dsh</text>
  <text x="100" y="446" font-size="12.5" fill="#475569">· ⚠️ CLI 有意不支持 --host 0.0.0.0 → 容器内 dsh 监听 127.0.0.1:3081，</text>
  <text x="100" y="468" font-size="12.5" fill="#475569">   由同容器 nginx 反代 0.0.0.0:3080 → 127.0.0.1:3081 对外</text>
  <text x="100" y="490" font-size="12.5" fill="#475569">· 数据卷挂载 $DSH_HOME，容器重建不丢凭据与会话</text>

  <text x="80" y="552" font-size="17" font-weight="700" fill="#7C5CD6">路径三 · VPS/云服务器（systemd + Nginx）</text>
  <rect x="80" y="564" width="520" height="176" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="100" y="584" width="480" height="34" rx="8" fill="#EEF2FF"/>
  <text x="110" y="606" font-size="13.5" font-family="Menlo,Consolas,monospace" fill="#3B5BC9">systemctl enable --now dsh · nginx proxy_pass 127.0.0.1:3080</text>
  <text x="100" y="642" font-size="12.5" fill="#475569">· systemd 单元：专用用户 + EnvironmentFile 注入 API Key，Restart=on-failure</text>
  <text x="100" y="664" font-size="12.5" fill="#475569">· Nginx 终结 HTTPS；--trusted-host 把域名加进 /api 浏览器信任围栏</text>
  <text x="100" y="686" font-size="12.5" fill="#475569">· 免公网暴露方案：ssh -L 3080:127.0.0.1:3080 user@vps 本地隧道</text>
  <text x="100" y="708" font-size="12.5" fill="#475569">· 会话权限默认 workspace-write；DSH_PERMISSION_MODE 可改后备值</text>

  <!-- 中间连接箭头 -->
  <line x1="620" y1="240" x2="672" y2="240" stroke="#94A3B8" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <line x1="620" y1="434" x2="672" y2="434" stroke="#94A3B8" stroke-width="2" marker-end="url(#dp-arrow)"/>
  <line x1="620" y1="652" x2="672" y2="652" stroke="#94A3B8" stroke-width="2" marker-end="url(#dp-arrow)"/>

  <!-- ============ 右列：多 Provider + 凭据 ============ -->
  <text x="700" y="116" font-size="17" font-weight="700" fill="#7C5CD6">模型提供方 · 一次配齐</text>
  <rect x="700" y="128" width="420" height="352" rx="12" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="720" y="146" width="380" height="52" rx="8" fill="#EEF2FF"/>
  <text x="734" y="166" font-size="13" font-weight="700" fill="#3B5BC9">DeepSeek 官方（默认）</text>
  <text x="734" y="186" font-size="11.5" fill="#475569">Web UI 设置→模型 填 Key；Key 只写不读回，存 $DSH_HOME/.credentials.yaml</text>

  <rect x="720" y="210" width="380" height="52" rx="8" fill="#F0FDFA"/>
  <text x="734" y="230" font-size="13" font-weight="700" fill="#0B8E82">OpenAI / Anthropic</text>
  <text x="734" y="250" font-size="11.5" fill="#475569">添加提供方 → 选目录提供方 → 填各自 API Key 即可</text>

  <rect x="720" y="274" width="380" height="52" rx="8" fill="#FDF2F8"/>
  <text x="734" y="294" font-size="13" font-weight="700" fill="#A21CAF">Azure / Bedrock / Vertex / Codex</text>
  <text x="734" y="314" font-size="11.5" fill="#475569">需要各自原生凭据：api-version / AWS 凭据 / ADC / OAuth，光填 Key 不够</text>

  <rect x="720" y="338" width="380" height="52" rx="8" fill="#FEF9C3"/>
  <text x="734" y="358" font-size="13" font-weight="700" fill="#854D0E">自定义 OpenAI 兼容端点</text>
  <text x="734" y="378" font-size="11.5" fill="#475569">公司网关/自托管：小写 Provider ID + baseURL + 协议 + 凭据 + ≥1 模型</text>

  <rect x="720" y="402" width="380" height="62" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="734" y="422" font-size="12.5" font-weight="700" fill="#1E2A3B">凭据解析顺序（CLI 文档）</text>
  <text x="734" y="442" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#475569">继承环境 → .credentials.yaml → 调用目录 .env → $DSH_HOME/.env</text>
  <text x="734" y="458" font-size="11" fill="#94A3B8">排错：MISSING_CREDENTIAL → 存 Key 或补环境变量；UNKNOWN_MODEL → 补模型</text>

  <!-- ============ 底部：验证三连 ============ -->
  <text x="80" y="790" font-size="17" font-weight="700" fill="#7C5CD6">部署后验证 · 三连</text>
  <rect x="80" y="802" width="250" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="205" y="828" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A3B">① 配置树体检</text>
  <text x="205" y="850" text-anchor="middle" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#475569">dsh web --dump-config</text>
  <rect x="350" y="802" width="250" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="475" y="828" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A3B">② 无头冒烟</text>
  <text x="475" y="850" text-anchor="middle" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#475569">dsh --profile headless "1+1=?"</text>
  <rect x="620" y="802" width="250" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="745" y="828" text-anchor="middle" font-size="13" font-weight="700" fill="#1E2A3B">③ 页面可达</text>
  <text x="745" y="850" text-anchor="middle" font-size="11.5" font-family="Menlo,Consolas,monospace" fill="#475569">curl -I 127.0.0.1:3080</text>
  <rect x="890" y="802" width="230" height="66" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
  <text x="1005" y="828" text-anchor="middle" font-size="13" font-weight="700" fill="#0B8E82">全部通过 → 开用</text>
  <text x="1005" y="850" text-anchor="middle" font-size="11.5" fill="#475569">退出码：headless 完成 0 / 失败 1</text>
</svg>
