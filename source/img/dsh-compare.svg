    <text x="240" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">Aider</text>
    <text x="240" y="558" text-anchor="middle" font-size="11.5" fill="#475569">4.8 万星 · Apache-2.0 · Git 原生结对</text>
