<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="rv-h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A6C0F2"/>
      <stop offset="1" stop-color="#BEADEB"/>
    </linearGradient>
  </defs>

  
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#A7B9D2">六款 AI 编程工具，谁适合你？</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#DFD3C3">一句话定位，按你的需求对号入座（信息查询于 2026-08-16）</text>

  <!-- 表头 -->
  <rect x="70" y="104" width="1060" height="44" rx="10" fill="#1E2A3B"/>
  <text x="150" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">工具</text>
  <text x="430" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">出品方</text>
  <text x="640" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">开源？</text>
  <text x="900" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#EFE6DA">一句话总结</text>

  <!-- 行：Harness（高亮） -->
  <rect x="70" y="158" width="1060" height="62" rx="10" fill="rgba(98,126,218,0.20)" stroke="#A6C0F2" stroke-width="1.5"/>
  <text x="150" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#B7C3EB">DeepSeek Harness</text>
  <text x="430" y="195" text-anchor="middle" font-size="14" fill="#E1D3C1">DeepSeek</text>
  <text x="640" y="195" text-anchor="middle" font-size="14" fill="#9EF1BD">✅ MIT</text>
  <text x="900" y="195" text-anchor="middle" font-size="14" fill="#A7B9D2">可定制性最强、最便宜，但还年轻</text>

  <!-- 行：Claude Code -->
  <rect x="70" y="230" width="1060" height="62" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="150" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#A7B9D2">Claude Code</text>
  <text x="430" y="267" text-anchor="middle" font-size="14" fill="#E1D3C1">Anthropic</text>
  <text x="640" y="267" text-anchor="middle" font-size="14" fill="#F2B0B0">❌ 闭源</text>
  <text x="900" y="267" text-anchor="middle" font-size="14" fill="#A7B9D2">最省心、生态最成熟，但要订阅</text>

  <!-- 行：Codex CLI -->
  <rect x="70" y="302" width="1060" height="62" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="150" y="339" text-anchor="middle" font-size="15" font-weight="700" fill="#A7B9D2">Codex CLI</text>
  <text x="430" y="339" text-anchor="middle" font-size="14" fill="#E1D3C1">OpenAI</text>
  <text x="640" y="339" text-anchor="middle" font-size="14" fill="#9EF1BD">✅ 开源</text>
  <text x="900" y="339" text-anchor="middle" font-size="14" fill="#A7B9D2">跟 GitHub 配合最好</text>

  <!-- 行：Gemini CLI -->
  <rect x="70" y="374" width="1060" height="62" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="150" y="411" text-anchor="middle" font-size="15" font-weight="700" fill="#A7B9D2">Gemini CLI</text>
  <text x="430" y="411" text-anchor="middle" font-size="14" fill="#E1D3C1">Google</text>
  <text x="640" y="411" text-anchor="middle" font-size="14" fill="#9EF1BD">✅ 开源</text>
  <text x="900" y="411" text-anchor="middle" font-size="14" fill="#A7B9D2">Google 生态用户的通用 Agent</text>

  <!-- 行：OpenHands -->
  <rect x="70" y="446" width="1060" height="62" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="150" y="483" text-anchor="middle" font-size="15" font-weight="700" fill="#A7B9D2">OpenHands</text>
  <text x="430" y="483" text-anchor="middle" font-size="14" fill="#E1D3C1">社区</text>
  <text x="640" y="483" text-anchor="middle" font-size="14" fill="#9EF1BD">✅ MIT</text>
  <text x="900" y="483" text-anchor="middle" font-size="14" fill="#A7B9D2">偏研究、多 Agent 协作</text>

  <!-- 行：Aider -->
  <rect x="70" y="518" width="1060" height="62" rx="10" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <text x="150" y="555" text-anchor="middle" font-size="15" font-weight="700" fill="#A7B9D2">Aider</text>
  <text x="430" y="555" text-anchor="middle" font-size="14" fill="#E1D3C1">社区</text>
  <text x="640" y="555" text-anchor="middle" font-size="14" fill="#9EF1BD">✅ 开源</text>
  <text x="900" y="555" text-anchor="middle" font-size="14" fill="#A7B9D2">极简，只做"结对写代码"</text>
</svg>
