<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="dsh-model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A3B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="dsh-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#7C5CD6"/>
    </linearGradient>
    <marker id="dsh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="920" rx="18" fill="#F6F8FB"/>
  <text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#1E2A3B">DeepSeek Harness 架构：Agent = Model + Harness</text>
  <text x="600" y="78" text-anchor="middle" font-size="15" fill="#64748B">模型负责推理决策，Harness 负责环境感知、工具调用与持续执行——而 Harness 的每一块都是可替换的插件</text>

  <!-- 入口层 -->
  <text x="90" y="118" font-size="16" font-weight="700" fill="#7C5CD6">入口层 · 三种姿势使用</text>
  <rect x="90" y="130" width="320" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="250" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">🖥️ Web UI</text>
  <text x="250" y="180" text-anchor="middle" font-size="12.5" fill="#475569">npx @deepseek-ai/dsh web · 127.0.0.1:3080</text>
  <rect x="440" y="130" width="320" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="600" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">⚡ headless 一次性任务</text>
  <text x="600" y="180" text-anchor="middle" font-size="12.5" fill="#475569">dsh --profile headless "跑一遍测试"</text>
  <rect x="790" y="130" width="320" height="66" rx="10" fill="#FFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="950" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1E2A3B">🧩 SDK 与插件生态</text>
  <text x="950" y="180" text-anchor="middle" font-size="12.5" fill="#475569">Python SDK · dsh-plugin 话题收录</text>

  <line x1="600" y1="196" x2="600" y2="226" stroke="#94A3B8" stroke-width="2" marker-end="url(#dsh-arrow)"/>

  <!-- Harness 核心层 -->
  <rect x="70" y="232" width="1060" height="398" rx="14" fill="#FFF" stroke="#C7D2FE" stroke-width="2"/>
  <rect x="70" y="232" width="1060" height="52" rx="14" fill="url(#dsh-core)"/>
  <rect x="70" y="262" width="1060" height="22" fill="url(#dsh-core)"/>
  <text x="600" y="264" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Harness 运行时 · 一切皆插件（基于 Cordis 插件树）</text>

  <!-- 插件格 1 行 -->
  <rect x="92" y="300" width="240" height="66" rx="10" fill="#EEF2FF"/>
  <text x="212" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">🔌 模型适配器（seam）</text>
  <text x="212" y="348" text-anchor="middle" font-size="11.5" fill="#475569">DeepSeek / OpenAI / Anthropic / 自建端点</text>
  <rect x="352" y="300" width="240" height="66" rx="10" fill="#EEF2FF"/>
  <text x="472" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">🛠️ 工具注册表 ctx.tools</text>
  <text x="472" y="348" text-anchor="middle" font-size="11.5" fill="#475569">Bash / FS / 终端 / LSP / 网页搜索…</text>
  <rect x="612" y="300" width="240" height="66" rx="10" fill="#EEF2FF"/>
  <text x="732" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">📚 技能 Skills</text>
  <text x="732" y="348" text-anchor="middle" font-size="11.5" fill="#475569">按需加载完整说明再执行</text>
  <rect x="872" y="300" width="236" height="66" rx="10" fill="#EEF2FF"/>
  <text x="990" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#3B5BC9">🎯 目标与计划</text>
  <text x="990" y="348" text-anchor="middle" font-size="11.5" fill="#475569">Goals · Plan Mode · Todo</text>

  <!-- 插件格 2 行 -->
  <rect x="92" y="378" width="240" height="66" rx="10" fill="#F0FDFA"/>
  <text x="212" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">⏰ 调度 Schedule</text>
  <text x="212" y="426" text-anchor="middle" font-size="11.5" fill="#475569">定时任务 schedule_create…</text>
  <rect x="352" y="378" width="240" height="66" rx="10" fill="#F0FDFA"/>
  <text x="472" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">👥 子代理 Subagent</text>
  <text x="472" y="426" text-anchor="middle" font-size="11.5" fill="#475569">委派 / fork / 后台继续跑</text>
  <rect x="612" y="378" width="240" height="66" rx="10" fill="#F0FDFA"/>
  <text x="732" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">📜 会话日志</text>
  <text x="732" y="426" text-anchor="middle" font-size="11.5" fill="#475569">模型可见即已记录 · 可回放</text>
  <rect x="872" y="378" width="236" height="66" rx="10" fill="#F0FDFA"/>
  <text x="990" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#0B8E82">🛡️ 沙箱与审批</text>
  <text x="990" y="426" text-anchor="middle" font-size="11.5" fill="#475569">危险操作前问人</text>

  <!-- 插件格 3 行 -->
  <rect x="92" y="456" width="240" height="66" rx="10" fill="#FDF2F8"/>
  <text x="212" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">🔧 运行时自定义</text>
  <text x="212" y="504" text-anchor="middle" font-size="11.5" fill="#475569">cordis_define 现场定义插件</text>
  <rect x="352" y="456" width="240" height="66" rx="10" fill="#FDF2F8"/>
  <text x="472" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">🌐 Web 工具</text>
  <text x="472" y="504" text-anchor="middle" font-size="11.5" fill="#475569">web_fetch / web_search</text>
  <rect x="612" y="456" width="240" height="66" rx="10" fill="#FDF2F8"/>
  <text x="732" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">🧠 上下文管理</text>
  <text x="732" y="504" text-anchor="middle" font-size="11.5" fill="#475569">提示词组装 · 压缩 · 溢出恢复</text>
  <rect x="872" y="456" width="236" height="66" rx="10" fill="#FDF2F8"/>
  <text x="990" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#A21CAF">⚙️ 命令与后台任务</text>
  <text x="990" y="504" text-anchor="middle" font-size="11.5" fill="#475569">ctx.commands · ctx.jobs</text>

  <!-- profile 说明条 -->
  <rect x="92" y="540" width="1016" height="70" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="600" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">Profile = 具名插件组合：web / headless 随发行版自带，其余用 dsh plugin 安装</text>
  <text x="600" y="590" text-anchor="middle" font-size="12.5" fill="#9A3412">组合包（bundle）按序叠放 → 用户 cordis.patch.yml → --patch 覆盖：任何配置项都能被替换，无需改核心代码</text>

  <line x1="600" y1="630" x2="600" y2="660" stroke="#94A3B8" stroke-width="2" marker-end="url(#dsh-arrow)"/>

  <!-- 模型层 -->
  <text x="90" y="690" font-size="16" font-weight="700" fill="#7C5CD6">模型层 · 可插拔提供方</text>
  <rect x="90" y="702" width="320" height="78" rx="10" fill="url(#dsh-model)"/>
  <text x="250" y="730" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">DeepSeek V4-Pro / V4-Flash</text>
  <text x="250" y="754" text-anchor="middle" font-size="12" fill="#CBD5E1">1M 上下文 · 384K 输出 · 思考强度可调</text>
  <rect x="440" y="702" width="320" height="78" rx="10" fill="url(#dsh-model)"/>
  <text x="600" y="730" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">目录提供方</text>
  <text x="600" y="754" text-anchor="middle" font-size="12" fill="#CBD5E1">OpenAI / Anthropic / Azure / Vertex / Codex</text>
  <rect x="790" y="702" width="320" height="78" rx="10" fill="url(#dsh-model)"/>
  <text x="950" y="730" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">自定义端点</text>
  <text x="950" y="754" text-anchor="middle" font-size="12" fill="#CBD5E1">公司网关 / 自托管 / OpenAI 兼容协议</text>

  <!-- 底部结论 -->
  <rect x="70" y="806" width="1060" height="88" rx="12" fill="#F0FDFA" stroke="#12B3A6" stroke-width="1.5"/>
  <text x="600" y="836" text-anchor="middle" font-size="16" font-weight="700" fill="#0B8E82">换掉一个插件，就换掉一种能力：文件系统与进程提供方指向远程沙箱，Bash、PTY、LSP 一起搬过去</text>
  <text x="600" y="864" text-anchor="middle" font-size="13.5" fill="#0F766E">没有特权内核，没有需要打补丁的黑盒——这就是「一切皆插件」和传统 Agent 框架最大的不同</text>
</svg>
